name: LockPlayer
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

targets:
  LockPlayer:
    type: application
    platform: macOS
    sources:
      - path: LockPlayer
      - path: Vendor/MediaRemoteAdapter
        type: folder
        buildPhase: resources
    info:
      path: LockPlayer/Info.plist
      properties:
        CFBundleDisplayName: LockPlayer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSAudioCaptureUsageDescription: "LockPlayer analyse le son en cours pour animer l'égaliseur du lecteur. Rien n'est enregistré."
        NSAppleEventsUsageDescription: "LockPlayer lit le morceau en cours dans Spotify si l'accès MediaRemote ne fonctionne pas."
    entitlements:
      path: LockPlayer/LockPlayer.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lockplayer.app
        PRODUCT_NAME: LockPlayer
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
